[project]
name = "jevfence"
version = "0.1.0"
description = "Plug-and-play guardrail layer for LLM systems, powered by TypeSafe AI's Jev (System One) classifier."
requires-python = ">=3.10"
dependencies = ["typesafe-sdk"]

[project.optional-dependencies]
playground = ["streamlit"]
server = ["fastapi", "uvicorn"]
dev = ["pytest", "httpx"]

[project.scripts]
jevfence-server = "jevfence.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevfence"]
